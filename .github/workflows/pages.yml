name: Build data & deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    # FloodNet open data updates about every two weeks; refresh weekly (Mondays 10:00 UTC)
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest open data and build site data
        # Falls back to the committed data if any source is temporarily unavailable.
        run: python3 scripts/build_data.py || python3 scripts/build_data.py --offline
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
